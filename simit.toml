[ci]
runtime = "nix"
runner = "ubuntu-24.04"
workspace = true
with_docs = true
publish_crates = true
with_audit = true
with_deny = true
provider = "actions"
platform = "github"
publish_strategy = "members"

# Public caches only; the private macOS SDK cache is a prebuild/release concern.
[ci.cache]
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]

[vscode]
extension_dir = "pkl-lsp-vscode"
runner = "atlas-nix-trusted"
codeberg_repo = "caniko/pkl-lsp"
codeberg_token_secret = "codeberg_token"
pat_source = "file-env"
vsce_pat_file_env = "VSCE_PAT_FILE"
ovsx_pat_file_env = "OVSX_PAT_FILE"
cargo_package = "pkl-lsp-server"
package_command = "nix run .#package-release-assets -- \"$VERSION\""
prepublish_commands = [
  "nix develop -c cargo test --workspace --all-features",
  "nix develop -c cargo clippy --workspace --all-targets --all-features -- --deny warnings",
  "nix develop -c cargo check -p pkl-lsp-wasm --target wasm32-unknown-unknown",
  '''
set -euo pipefail
nix develop -c cargo tree -p pkl-lsp-wasm --target wasm32-unknown-unknown > wasm-tree.txt
if grep -E '(^|[[:space:]├└│─]+)(reqwest|zip|tokio|miette|url|icu_[A-Za-z0-9_-]+) v' wasm-tree.txt; then
  echo "forbidden native or URL/ICU dependency found in pkl-lsp-wasm tree" >&2
  exit 1
fi
''',
  "nix flake check --no-build",
  '''
set -euo pipefail
nix develop -c wasm-pack build crates/pkl-lsp-wasm --target web --release --out-dir ../../pkl-lsp-vscode/media --no-opt
nix develop -c wasm-opt --enable-bulk-memory -Oz pkl-lsp-vscode/media/pkl_lsp_wasm_bg.wasm -o pkl-lsp-vscode/media/pkl_lsp_wasm_bg.wasm
wasm_size="$(wc -c < pkl-lsp-vscode/media/pkl_lsp_wasm_bg.wasm)"
if [ "$wasm_size" -gt 307200 ]; then
  echo "optimized WASM is $wasm_size bytes, above 307200 byte release gate" >&2
  exit 1
fi
cd pkl-lsp-vscode
nix develop -c npm ci
nix develop -c npm run compile
nix develop -c npm audit --omit=dev --audit-level=moderate
''',
]

[jetbrains]
plugin_dir = "pkl-lsp-jetbrains"
plugin_xml_id = "com.tartanoglu.pkl-lsp"
package_installable = ".#jetbrains-plugin"
runner = "atlas-nix-trusted"
cargo_package = "pkl-lsp-server"
credential_source = "file-env"
marketplace_token_file_env = "JETBRAINS_MARKETPLACE_TOKEN_FILE"
certificate_chain_file_env = "JETBRAINS_CERTIFICATE_CHAIN_FILE"
private_key_file_env = "JETBRAINS_PRIVATE_KEY_FILE"
private_key_password_file_env = "JETBRAINS_PRIVATE_KEY_PASSWORD_FILE"
prepublish_commands = ["nix flake check --no-build"]

# Hosted coverage for the outputs that need the private macOS SDK cache:
# the darwin servers and the JetBrains plugin that bundles them.
[prebuild]
nix_builds = [
  ".#packages.x86_64-linux.pkl-lsp-server-darwin-x64",
  ".#packages.x86_64-linux.pkl-lsp-server-darwin-arm64",
  ".#packages.x86_64-linux.jetbrains-plugin",
]
system_runners = { x86_64-linux = "ubuntu-24.04" }

[release.artifacts]
netrc_secret = "HARBOR_MACOS_SDK_NETRC"
substituters = [
  "https://attic.candee.baby/canix",
  "https://attic.candee.baby/harbor-macos-sdk",
  "https://cache.nixos.org",
]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "harbor-macos-sdk:MLRX9qZASKwDh48UWON67cvYxfEbqvjfIZQmGwt1v1E=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]
