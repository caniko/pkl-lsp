# Generated by simit. Manual edits will be reported as ci=drift.
name: publish-jetbrains-plugin
labels:
  agent: codefloe-global
  platform: linux/amd64
when:
- event: tag
steps:
- name: publish-jetbrains-plugin
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix flake check --no-build
  - test -f '.#jetbrains-plugin'
  - cargo build -p pkl-lsp-server
  environment:
    JETBRAINS_CERTIFICATE_CHAIN:
      from_secret: JETBRAINS_CERTIFICATE_CHAIN
    JETBRAINS_MARKETPLACE_TOKEN:
      from_secret: JETBRAINS_MARKETPLACE_TOKEN
    JETBRAINS_PRIVATE_KEY:
      from_secret: JETBRAINS_PRIVATE_KEY
    JETBRAINS_PRIVATE_KEY_PASSWORD:
      from_secret: JETBRAINS_PRIVATE_KEY_PASSWORD
