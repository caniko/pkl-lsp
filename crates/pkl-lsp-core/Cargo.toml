[package]
name = "pkl-lsp-core"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/pkl-lsp"
homepage.workspace = true
rust-version = "1.88"
description = "Core PKL language analysis for pkl-lsp"
keywords = ["pkl", "language-server", "parser"]
categories = ["parser-implementations", "development-tools"]
readme = "README.md"
documentation = "https://docs.rs/pkl-lsp-core"
include = [
  "/src/**/*",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
pklr.workspace = true
rkyv.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
