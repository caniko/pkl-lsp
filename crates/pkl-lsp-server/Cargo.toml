[package]
name = "pkl-lsp-server"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/pkl-lsp"
homepage.workspace = true
description = "Native stdio Language Server Protocol server for PKL"
rust-version = "1.88"
keywords = ["pkl", "language-server", "lsp"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
documentation = "https://docs.rs/pkl-lsp-server"
include = [
  "/src/**/*",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "pkl-lsp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
lsp-types.workspace = true
pkl-lsp-core = { version = "0.2", path = "../pkl-lsp-core" }
serde_json.workspace = true
tokio.workspace = true
