[workspace]
resolver = "2"
members = [
  "crates/pkl-lsp-core",
  "crates/pkl-lsp-server",
  "crates/pkl-lsp-wasm",
  "vendor/pklr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/pkl-lsp"
homepage = "https://codeberg.org/caniko/pkl-lsp"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
futures = "0.3"
lsp-types = "0.97"
pklr = { path = "vendor/pklr", default-features = false, features = ["parse"] }
rkyv = { version = "0.8", features = ["bytecheck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
