# Generated by simit. Manual edits will be reported as ci=drift.
name: Publish JetBrains Plugin

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version to publish (for example 0.2.1)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate JetBrains publishing credentials
        run: |
          set -euo pipefail
          umask 077
          use_file_env=false
          if [ -n "${JETBRAINS_MARKETPLACE_TOKEN_FILE:-}" ] && [ -s "${JETBRAINS_MARKETPLACE_TOKEN_FILE}" ] && [ -n "${JETBRAINS_CERTIFICATE_CHAIN_FILE:-}" ] && [ -s "${JETBRAINS_CERTIFICATE_CHAIN_FILE}" ] && [ -n "${JETBRAINS_PRIVATE_KEY_FILE:-}" ] && [ -s "${JETBRAINS_PRIVATE_KEY_FILE}" ] && [ -n "${JETBRAINS_PRIVATE_KEY_PASSWORD_FILE:-}" ] && [ -s "${JETBRAINS_PRIVATE_KEY_PASSWORD_FILE}" ]; then
            use_file_env=true
          fi
          if [ "$use_file_env" = true ]; then
            cp "${JETBRAINS_MARKETPLACE_TOKEN_FILE}" "$RUNNER_TEMP/marketplace-token"
            cp "${JETBRAINS_CERTIFICATE_CHAIN_FILE}" "$RUNNER_TEMP/certificate-chain.pem"
            cp "${JETBRAINS_PRIVATE_KEY_FILE}" "$RUNNER_TEMP/private-key.pem"
            cp "${JETBRAINS_PRIVATE_KEY_PASSWORD_FILE}" "$RUNNER_TEMP/private-key-password"
          fi
          test "$use_file_env" = true
          printf '%s\n' 'JetBrains publishing credentials validated'

      - name: Validate plugin version and metadata
        env:
          TAG_LABEL: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          PLUGIN_DIR: pkl-lsp-jetbrains
          PLUGIN_XML_ID: com.tartanoglu.pkl-lsp
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_VERSION" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="$TAG_LABEL"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cargo_metadata=$(nix shell nixpkgs#cargo -c cargo metadata --format-version 1 --no-deps)
          # jq variables are expanded by jq, not the shell.
          # shellcheck disable=SC2016
          cargo_version=$(printf '%s' "$cargo_metadata" | nix shell nixpkgs#jq -c jq -r --arg package pkl-lsp-server '.packages[] | select(.name == $package) | .version' | head -n1)
          test "$cargo_version" = "$VERSION"
          test -f "$PLUGIN_DIR/src/main/resources/META-INF/plugin.xml"
          grep -Fq "<id>$PLUGIN_XML_ID</id>" "$PLUGIN_DIR/src/main/resources/META-INF/plugin.xml"

          grep -Eq "^[[:space:]]*pluginVersion[[:space:]]*=[[:space:]]*$VERSION$" "$PLUGIN_DIR/gradle.properties"

          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

      - name: Prepublish command 1
        run: |
          nix flake check --no-build

      - name: Build installable plugin
        env:
          INSTALLABLE: .#jetbrains-plugin
        run: |
          set -euo pipefail
          result=$(nix build --no-link --print-out-paths "$INSTALLABLE" | tail -n1)
          mapfile -t zips < <(find "$result" -type f -name '*.zip' -print)
          test "${#zips[@]}" -eq 1
          basename "${zips[0]}" > "$RUNNER_TEMP/jetbrains-plugin-archive-name"
          cp "${zips[0]}" "$RUNNER_TEMP/jetbrains-plugin-unsigned.zip"
          chmod u+w "$RUNNER_TEMP/jetbrains-plugin-unsigned.zip"
          sha256sum "$RUNNER_TEMP/jetbrains-plugin-unsigned.zip"
          stat --printf='plugin archive size: %s bytes\n' "$RUNNER_TEMP/jetbrains-plugin-unsigned.zip"

      - name: Sign plugin
        env:
          PLUGIN_DIR: pkl-lsp-jetbrains
        run: |
          set -euo pipefail
          cd "$PLUGIN_DIR"
          mkdir -p build/distributions
          archive_name=$(cat "$RUNNER_TEMP/jetbrains-plugin-archive-name")
          test -n "$archive_name"
          cp "$RUNNER_TEMP/jetbrains-plugin-unsigned.zip" "build/distributions/$archive_name"
          rm -f -- "$RUNNER_TEMP/jetbrains-plugin-signed-path"
          cat > "$RUNNER_TEMP/jetbrains-signed-archive.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              def currentDir = gradle.startParameter.currentDir.canonicalFile
              def projects = gradle.rootProject.allprojects.findAll { it.projectDir.canonicalFile == currentDir }
              if (projects.size() != 1) {
                  throw new GradleException('expected exactly one JetBrains plugin project')
              }
              def sign = projects[0].tasks.named('signPlugin').get()
              def verify = projects[0].tasks.named('verifyPluginSignature').get()
              verify.inputArchiveFile.set(sign.signedArchiveFile)
              verify.outputs.upToDateWhen { false }
              verify.doLast {
                  def signed = sign.signedArchiveFile.get().asFile.canonicalFile
                  def unsigned = sign.archiveFile.get().asFile.canonicalFile
                  if (!signed.isFile() || !unsigned.isFile() || java.nio.file.Files.isSameFile(signed.toPath(), unsigned.toPath())) {
                      throw new GradleException('missing signed archive or unsigned archive selected')
                  }
                  new File(System.getenv('RUNNER_TEMP'), 'jetbrains-plugin-signed-path').text = signed.path + '\n'
              }
          }
          GRADLE
          CERTIFICATE_CHAIN_FILE="$RUNNER_TEMP/certificate-chain.pem" \
          PRIVATE_KEY_FILE="$RUNNER_TEMP/private-key.pem" \
          PRIVATE_KEY_PASSWORD="$(cat "$RUNNER_TEMP/private-key-password")" \
          nix shell nixpkgs#gradle_9 nixpkgs#jdk21 -c gradle --no-daemon -x buildPlugin signPlugin verifyPluginSignature --init-script "$RUNNER_TEMP/jetbrains-signed-archive.gradle"
          mapfile -t signed_paths < "$RUNNER_TEMP/jetbrains-plugin-signed-path"
          test "${#signed_paths[@]}" -eq 1 || { echo 'expected exactly one verified signed plugin archive' >&2; exit 1; }
          signed="${signed_paths[0]}"
          test -f "$signed" && test ! "$signed" -ef "build/distributions/$archive_name" || { echo 'missing signed archive or unsigned archive selected' >&2; exit 1; }
          cp "$signed" "$RUNNER_TEMP/jetbrains-plugin-signed.zip"

      - name: Publish to JetBrains Marketplace
        env:
          PLUGIN_XML_ID: com.tartanoglu.pkl-lsp
          CHANNEL: ''
        run: |
          set -euo pipefail
          JETBRAINS_MARKETPLACE_TOKEN=$(cat "$RUNNER_TEMP/marketplace-token")
          upload_url="https://plugins.jetbrains.com/api/updates/upload"
          upload_args=(-F "xmlId=$PLUGIN_XML_ID" -F "file=@$RUNNER_TEMP/jetbrains-plugin-signed.zip;type=application/zip")
          if [ -n "$CHANNEL" ]; then
            upload_args+=(-F "channel=$CHANNEL")
          fi
          curl --fail-with-body --retry 3 -X POST -H "Authorization: Bearer $JETBRAINS_MARKETPLACE_TOKEN" "${upload_args[@]}" "$upload_url"
      - name: Upload signed plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkl-lsp-jetbrains-${{ github.ref_name }}
          path: ${{ runner.temp }}/jetbrains-plugin-signed.zip
