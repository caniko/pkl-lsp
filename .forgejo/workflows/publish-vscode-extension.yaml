name: Publish VS Code Extension

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
      PKL_LSP_VSIX_TARGETS: "linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Validate signed release tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
            exit 1
          fi

          cargo_version="$(nix develop -c cargo pkgid -p pkl-lsp-server | awk -F'[#@]' '{print $NF}')"
          extension_version="$(nix develop -c node -e "console.log(require('./pkl-lsp-vscode/package.json').version)")"
          if [ "$tag" != "$cargo_version" ]; then
            echo "Tag $tag does not match Cargo package version $cargo_version" >&2
            exit 1
          fi
          if [ "$tag" != "$extension_version" ]; then
            echo "Tag $tag does not match extension package version $extension_version" >&2
            exit 1
          fi

          test -s keys/maintainers.gpg
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          gpg --batch --import keys/maintainers.gpg
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"

      - name: Rust tests
        run: nix develop -c cargo test --workspace --all-features

      - name: Rust clippy
        run: nix develop -c cargo clippy --workspace --all-targets --all-features -- --deny warnings

      - name: WASM target check
        run: nix develop -c cargo check -p pkl-lsp-wasm --target wasm32-unknown-unknown

      - name: Flake check
        run: nix flake check --no-build

      - name: TypeScript compile
        run: |
          set -euo pipefail
          cd pkl-lsp-vscode
          nix develop -c npm ci
          nix develop -c npm run compile
          nix develop -c npm audit --omit=dev --audit-level=moderate

      - name: Package VSIX artifacts
        run: nix run .#package-vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT is not configured; skipping VS Code Marketplace publish"
            exit 0
          fi
          cd pkl-lsp-vscode
          for package in ./*.vsix; do
            [ -e "$package" ] || {
              echo "No VSIX packages found" >&2
              exit 1
            }
            npx vsce publish --packagePath "$package" --pat "$VSCE_PAT"
          done

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "OVSX_PAT is not configured; skipping Open VSX publish"
            exit 0
          fi
          cd pkl-lsp-vscode
          for package in ./*.vsix; do
            [ -e "$package" ] || {
              echo "No VSIX packages found" >&2
              exit 1
            }
            npx ovsx --pat "$OVSX_PAT" publish "$package"
          done
