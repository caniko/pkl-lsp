# Generated by simit. Manual edits will be reported as ci=drift.
name: Publish VS Code Extension

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate publish credentials
        env:
          CODEBERG_TOKEN: ${{ secrets.codeberg_token }}
        run: |
          set -euo pipefail
          test -n "${CODEBERG_TOKEN:-}" || { echo "missing Actions secret codeberg_token"; exit 1; }
          resolve_pat() {
            case "$1" in
              vsce) file_env=VSCE_PAT_FILE; secret="${VSCE_PAT_FROM_SECRET:-}" ;;
              ovsx) file_env=OVSX_PAT_FILE; secret="${OVSX_PAT_FROM_SECRET:-}" ;;
              *) echo "unknown publisher $1" >&2; exit 1 ;;
            esac
            file_path="${!file_env:-}"
            test -n "$file_path" || { echo "missing runner file env ${file_env}" >&2; exit 1; }
            test -s "$file_path" || { echo "runner file env ${file_env} points at an empty or missing file" >&2; exit 1; }
            cat "$file_path"
          }
          VSCE_PUBLISH_PAT=$(resolve_pat vsce)
          VSCE_PUBLISHER=$(nix shell nixpkgs#jq -c jq -r '.publisher' pkl-lsp-vscode/package.json)
          test -n "$VSCE_PUBLISHER" && test "$VSCE_PUBLISHER" != null || { echo "missing VS Code extension publisher in pkl-lsp-vscode/package.json"; exit 1; }
          nix develop -c npx --yes @vscode/vsce verify-pat "$VSCE_PUBLISHER" --pat "$VSCE_PUBLISH_PAT" || { echo "VS Code Marketplace publisher $VSCE_PUBLISHER is missing or the VSCE PAT lacks publisher permissions. Create/repair it at https://aka.ms/vsm-create-publisher before publishing."; exit 1; }
          resolve_pat ovsx >/dev/null

      - name: Validate release tag and extension version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "release tag must be an exact semver version"; exit 1; }
          cargo_metadata=$(nix shell nixpkgs#cargo -c cargo metadata --no-deps --format-version 1)
          cargo_version=$(printf '%s' "$cargo_metadata" | nix shell nixpkgs#jq -c jq -r --arg name pkl-lsp-server '.packages[] | select(.name == $name) | .version')
          test -n "$cargo_version" || { echo "missing Cargo package pkl-lsp-server"; exit 1; }
          test "$cargo_version" = "$VERSION" || { echo "Cargo version $cargo_version does not match tag $VERSION"; exit 1; }
          extension_version=$(nix shell nixpkgs#jq -c jq -r '.version' pkl-lsp-vscode/package.json)
          test "$extension_version" = "$VERSION" || { echo "extension version $extension_version does not match tag $VERSION"; exit 1; }

          test -s keys/maintainers.gpg
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          gpg --batch --import keys/maintainers.gpg
          git fetch --force --tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git verify-tag "$GITHUB_REF_NAME"

      - name: Prepublish command 1
        run: |
          nix develop -c cargo test --workspace --all-features

      - name: Prepublish command 2
        run: |
          nix develop -c cargo clippy --workspace --all-targets --all-features -- --deny warnings

      - name: Prepublish command 3
        run: |
          nix develop -c cargo check -p pkl-lsp-wasm --target wasm32-unknown-unknown

      - name: Prepublish command 4
        run: |
          set -euo pipefail
          nix develop -c cargo tree -p pkl-lsp-wasm --target wasm32-unknown-unknown > wasm-tree.txt
          if grep -E '(^|[[:space:]├└│─]+)(reqwest|zip|tokio|miette|url|icu_[A-Za-z0-9_-]+) v' wasm-tree.txt; then
            echo "forbidden native or URL/ICU dependency found in pkl-lsp-wasm tree" >&2
            exit 1
          fi

      - name: Prepublish command 5
        run: |
          nix flake check --no-build

      - name: Prepublish command 6
        run: |
          set -euo pipefail
          nix develop -c wasm-pack build crates/pkl-lsp-wasm --target web --release --out-dir ../../pkl-lsp-vscode/media --no-opt
          nix develop -c wasm-opt --enable-bulk-memory -Oz pkl-lsp-vscode/media/pkl_lsp_wasm_bg.wasm -o pkl-lsp-vscode/media/pkl_lsp_wasm_bg.wasm
          wasm_size="$(wc -c < pkl-lsp-vscode/media/pkl_lsp_wasm_bg.wasm)"
          if [ "$wasm_size" -gt 307200 ]; then
            echo "optimized WASM is $wasm_size bytes, above 307200 byte release gate" >&2
            exit 1
          fi
          cd pkl-lsp-vscode
          nix develop -c npm ci
          nix develop -c npm run compile
          nix develop -c npm audit --omit=dev --audit-level=moderate

      - name: Package release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          nix run .#package-release-assets -- "$VERSION"

      - name: Upload Codeberg release assets
        env:
          CODEBERG_TOKEN: ${{ secrets.codeberg_token }}
        run: |
          set -euo pipefail
          test -n "${CODEBERG_TOKEN:-}" || { echo "missing Actions secret codeberg_token"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          tag="${GITHUB_REF_NAME}"
          api='https://codeberg.org/api/v1'
          repo=caniko/pkl-lsp
          auth_header="Authorization: token ${CODEBERG_TOKEN}"
          release_json=$(curl --fail --silent --show-error --header "$auth_header" "$api/repos/$repo/releases/tags/$tag" || true)
          release_id=$(printf '%s' "$release_json" | nix shell nixpkgs#jq -c jq -r '.id // empty' 2>/dev/null || true)
          if test -z "$release_id"; then
            release_json=$(curl --fail --silent --show-error --request POST --header "$auth_header" --header "Content-Type: application/json" --data "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"draft\":false,\"prerelease\":false}" "$api/repos/$repo/releases")
            release_id=$(printf '%s' "$release_json" | nix shell nixpkgs#jq -c jq -r '.id')
          fi
          for asset in release/*; do
            test -f "$asset" || continue
            name=$(basename "$asset")
            existing_ids=$(printf '%s' "$release_json" | nix shell nixpkgs#jq -c jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id')
            for asset_id in $existing_ids; do
              curl --fail --silent --show-error --request DELETE --header "$auth_header" "$api/repos/$repo/releases/$release_id/assets/$asset_id" >/dev/null
            done
            curl --fail --silent --show-error --request POST --header "$auth_header" --form "attachment=@${asset}" "$api/repos/$repo/releases/$release_id/assets?name=$name" >/dev/null
          done

      - name: Publish to VS Code Marketplace
        run: |
          set -euo pipefail
          resolve_pat() {
            case "$1" in
              vsce) file_env=VSCE_PAT_FILE; secret="${VSCE_PAT_FROM_SECRET:-}" ;;
              ovsx) file_env=OVSX_PAT_FILE; secret="${OVSX_PAT_FROM_SECRET:-}" ;;
              *) echo "unknown publisher $1" >&2; exit 1 ;;
            esac
            file_path="${!file_env:-}"
            test -n "$file_path" || { echo "missing runner file env ${file_env}" >&2; exit 1; }
            test -s "$file_path" || { echo "runner file env ${file_env} points at an empty or missing file" >&2; exit 1; }
            cat "$file_path"
          }
          PUBLISH_PAT=$(resolve_pat vsce)
          nix develop -c npx --yes @vscode/vsce publish --packagePath release/*.vsix --pat "$PUBLISH_PAT" --skip-duplicate

      - name: Verify VS Code Marketplace visibility
        run: |
          set -euo pipefail
          resolve_pat() {
            case "$1" in
              vsce) file_env=VSCE_PAT_FILE; secret="${VSCE_PAT_FROM_SECRET:-}" ;;
              ovsx) file_env=OVSX_PAT_FILE; secret="${OVSX_PAT_FROM_SECRET:-}" ;;
              *) echo "unknown publisher $1" >&2; exit 1 ;;
            esac
            file_path="${!file_env:-}"
            test -n "$file_path" || { echo "missing runner file env ${file_env}" >&2; exit 1; }
            test -s "$file_path" || { echo "runner file env ${file_env} points at an empty or missing file" >&2; exit 1; }
            cat "$file_path"
          }
          PUBLISH_PAT=$(resolve_pat vsce)
          export PUBLISH_PAT
          EXTENSION_PUBLISHER=$(nix shell nixpkgs#jq -c jq -r '.publisher' pkl-lsp-vscode/package.json)
          EXTENSION_NAME=$(nix shell nixpkgs#jq -c jq -r '.name' pkl-lsp-vscode/package.json)
          EXTENSION_ID="$EXTENSION_PUBLISHER.$EXTENSION_NAME"
          export EXTENSION_PUBLISHER EXTENSION_NAME EXTENSION_ID
          diag_dir=$(mktemp -d)
          trap 'rm -rf "$diag_dir"' EXIT
          nix develop -c npm --prefix "$diag_dir" install --silent azure-devops-node-api@15.1.2 >/dev/null
          NODE_PATH="$diag_dir/node_modules" nix develop -c node <<'NODE'
          const azdev = require('azure-devops-node-api');
          const { GalleryApi } = require('azure-devops-node-api/GalleryApi');
          const Gallery = require('azure-devops-node-api/interfaces/GalleryInterfaces');
          const publisher = process.env.EXTENSION_PUBLISHER;
          const extension = process.env.EXTENSION_NAME;
          const pat = process.env.PUBLISH_PAT;
          const flags = Gallery.PublishedExtensionFlags;
          const queryFlags = Gallery.ExtensionQueryFlags.IncludeVersions | Gallery.ExtensionQueryFlags.IncludeMetadata;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const flagNames = value => Object.entries(flags)
            .filter(([name, flag]) => typeof flag === 'number' && flag !== 0 && (value & flag) !== 0)
            .map(([name]) => name)
            .sort();
          async function main() {
            const api = new GalleryApi('https://marketplace.visualstudio.com', [azdev.getPersonalAccessTokenHandler(pat)]);
            let last;
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              let ext;
              try {
                ext = await api.getExtension(null, publisher, extension, undefined, queryFlags);
              } catch (error) {
                if (error && error.statusCode === 404) {
                  last = 'not found via authenticated Gallery API';
                  await sleep(10000);
                  continue;
                }
                throw error;
              }
              if (!ext) {
                last = 'not found via authenticated Gallery API';
                await sleep(10000);
                continue;
              }
              let value = Number(ext.flags || 0);
              if ((value & flags.Public) === 0) {
                console.log(`Marketplace extension is missing Public flag; setting it for ${publisher}.${extension}`);
                ext = await api.updateExtensionProperties(publisher, extension, flags.Public);
                value = Number(ext.flags || 0);
              }
              const versions = (ext.versions || []).map(version => ({ version: version.version, targetPlatform: version.targetPlatform || null, flags: version.flags || null }));
              console.log(JSON.stringify({ id: `${publisher}.${extension}`, flags: value, flagNames: flagNames(value), versions }, null, 2));
              if ((value & flags.Public) !== 0 && (value & flags.Validated) !== 0) {
                return;
              }
              last = `flags=${value} (${flagNames(value).join(',') || 'none'})`;
              await sleep(10000);
            }
            throw new Error(`Marketplace extension did not become public and validated: ${last}`);
          }
          main().catch(error => {
            console.error(error && error.stack ? error.stack : error);
            process.exit(1);
          });
          NODE
          for attempt in $(seq 1 60); do
            query=$(nix shell nixpkgs#jq -c jq -cn --arg id "$EXTENSION_ID" '{filters:[{criteria:[{filterType:7,value:$id}]}],flags:2151}')
            result=$(curl --fail --silent --show-error --header 'Content-Type: application/json' --header 'Accept: application/json;api-version=7.2-preview.1' --data "$query" https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery)
            visible=$(printf '%s' "$result" | nix shell nixpkgs#jq -c jq -r --arg id "$EXTENSION_ID" '.results[0].extensions[]? | select((.publisher.publisherName + "." + .extensionName | ascii_downcase) == ($id | ascii_downcase)) | .flags')
            if printf '%s\n' "$visible" | grep -Eq '(^|, )public(,|$)' && printf '%s\n' "$visible" | grep -Eq '(^|, )validated(,|$)'; then
              echo "$EXTENSION_ID is visible in the public VS Code Marketplace Gallery API"
              exit 0
            fi
            echo "waiting for $EXTENSION_ID to become public in Marketplace Gallery API (attempt $attempt/60)"
            sleep 10
          done
          echo "$EXTENSION_ID did not become visible in the public VS Code Marketplace Gallery API" >&2
          exit 1

      - name: Verify VS Code Marketplace signatures
        run: |
          set -euo pipefail
          EXTENSION_PUBLISHER=$(nix shell nixpkgs#jq -c jq -r '.publisher' pkl-lsp-vscode/package.json)
          EXTENSION_NAME=$(nix shell nixpkgs#jq -c jq -r '.name' pkl-lsp-vscode/package.json)
          EXTENSION_ID="$EXTENSION_PUBLISHER.$EXTENSION_NAME"
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          query=$(nix shell nixpkgs#jq -c jq -cn --arg id "$EXTENSION_ID" '{filters:[{criteria:[{filterType:7,value:$id}]}],flags:2151}')
          result=$(curl --fail --silent --show-error --header 'Content-Type: application/json' --header 'Accept: application/json;api-version=7.2-preview.1' --data "$query" https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery)
          versions_tsv="$tmp_dir/versions.tsv"
          printf '%s' "$result" | nix shell nixpkgs#jq -c jq -r --arg id "$EXTENSION_ID" '
            .results[0].extensions[]?
            | select((.publisher.publisherName + "." + .extensionName | ascii_downcase) == ($id | ascii_downcase))
            | .versions[]
            | [
                .version,
                (.targetPlatform // "universal"),
                ((.files[]? | select(.assetType == "Microsoft.VisualStudio.Services.VSIXPackage") | .source) // ""),
                ((.files[]? | select(.assetType == "Microsoft.VisualStudio.Services.VsixSignature") | .source) // "")
              ]
            | @tsv
          ' > "$versions_tsv"
          test -s "$versions_tsv" || { echo "no Marketplace versions found for $EXTENSION_ID" >&2; exit 1; }
          sign_glibc="$(nix eval --raw nixpkgs#glibc)"
          sign_cxx="$(nix eval --raw nixpkgs#stdenv.cc.cc.lib)"
          sign_libgcc="$(nix eval --raw nixpkgs#stdenv.cc.cc.libgcc)"
          sign_openssl="$(nix eval --raw nixpkgs#openssl.out)"
          sign_nix_ld="$(nix eval --raw nixpkgs#nix-ld)"
          vsce_runtime_path="$sign_glibc/lib:$sign_cxx/lib:$sign_libgcc/lib:$sign_openssl/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          sign_binary="pkl-lsp-vscode/node_modules/@vscode/vsce-sign/bin/vsce-sign"
          test -x "$sign_binary" || { echo "missing executable $sign_binary" >&2; exit 1; }
          nix develop -c patchelf \
            --set-interpreter "$sign_nix_ld/bin/nix-ld" \
            --set-rpath "$vsce_runtime_path:\$ORIGIN/netcoredeps" \
            "$sign_binary"
          while IFS=$'\t' read -r version target package_url signature_url; do
            test -n "$package_url" || { echo "missing VSIXPackage asset for $EXTENSION_ID@$version ($target)" >&2; exit 1; }
            test -n "$signature_url" || { echo "missing VsixSignature asset for $EXTENSION_ID@$version ($target)" >&2; exit 1; }
            target_dir="$tmp_dir/$version-$target"
            mkdir -p "$target_dir"
            package_path="$target_dir/package.vsix"
            signature_zip="$target_dir/signature.zip"
            verified=false
            for attempt in $(seq 1 12); do
              manifest_path="$target_dir/signature.manifest"
              signature_path="$target_dir/signature.p7s"
              if ! curl --fail --silent --show-error --location "$package_url" --output "$package_path" \
                || ! curl --fail --silent --show-error --location "$signature_url" --output "$signature_zip"; then
                echo "Marketplace signature assets are not ready for $EXTENSION_ID@$version ($target); retrying ($attempt/12)"
                sleep 10
                continue
              fi
              rm -rf "$target_dir/signature"
              mkdir -p "$target_dir/signature"
              if ! nix shell nixpkgs#unzip -c unzip -q "$signature_zip" -d "$target_dir/signature" \
                || ! test -s "$target_dir/signature/.signature.manifest" \
                || ! test -s "$target_dir/signature/.signature.p7s"; then
                echo "Marketplace signature archive is not ready for $EXTENSION_ID@$version ($target); retrying ($attempt/12)"
                sleep 10
                continue
              fi
              cp "$target_dir/signature/.signature.manifest" "$manifest_path"
              cp "$target_dir/signature/.signature.p7s" "$signature_path"
              if env -u GITHUB_ACTIONS \
                nix develop -c env \
                NIX_LD="$sign_glibc/lib/ld-linux-x86-64.so.2" \
                NIX_LD_LIBRARY_PATH="$vsce_runtime_path" \
                LD_LIBRARY_PATH="$vsce_runtime_path" \
                ./pkl-lsp-vscode/node_modules/ovsx/node_modules/.bin/vsce verify-signature \
                --packagePath "$package_path" --manifestPath "$manifest_path" --signaturePath "$signature_path"; then
                verified=true
                break
              fi
              echo "Marketplace signature verification is not ready for $EXTENSION_ID@$version ($target); retrying ($attempt/12)"
              sleep 10
            done
            test "$verified" = true || { echo "Marketplace signature verification failed for $EXTENSION_ID@$version ($target)" >&2; exit 1; }
            echo "verified Marketplace signature for $EXTENSION_ID@$version ($target)"
          done < "$versions_tsv"

      - name: Publish to Open VSX
        run: |
          set -euo pipefail
          resolve_pat() {
            case "$1" in
              vsce) file_env=VSCE_PAT_FILE; secret="${VSCE_PAT_FROM_SECRET:-}" ;;
              ovsx) file_env=OVSX_PAT_FILE; secret="${OVSX_PAT_FROM_SECRET:-}" ;;
              *) echo "unknown publisher $1" >&2; exit 1 ;;
            esac
            file_path="${!file_env:-}"
            test -n "$file_path" || { echo "missing runner file env ${file_env}" >&2; exit 1; }
            test -s "$file_path" || { echo "runner file env ${file_env} points at an empty or missing file" >&2; exit 1; }
            cat "$file_path"
          }
          PUBLISH_PAT=$(resolve_pat ovsx)
          OVSX_NAMESPACE=$(nix shell nixpkgs#jq -c jq -r '.publisher' pkl-lsp-vscode/package.json)
          OVSX_EXTENSION=$(nix shell nixpkgs#jq -c jq -r '.name' pkl-lsp-vscode/package.json)
          VERSION="${GITHUB_REF_NAME#v}"
          nix develop -c npx --yes ovsx create-namespace "$OVSX_NAMESPACE" --pat "$PUBLISH_PAT" || true
          nix develop -c npx --yes ovsx publish release/*.vsix --pat "$PUBLISH_PAT" --skip-duplicate
          for attempt in $(seq 1 60); do
            version_info=$(curl --fail --silent --show-error "https://open-vsx.org/api/$OVSX_NAMESPACE/$OVSX_EXTENSION/$VERSION")
            if printf '%s' "$version_info" | nix shell nixpkgs#jq -c jq -e --arg version "$VERSION" '.version == $version' >/dev/null; then
              echo "Open VSX exposes $OVSX_NAMESPACE.$OVSX_EXTENSION@$VERSION"
              exit 0
            fi
            echo "waiting for Open VSX to expose $OVSX_NAMESPACE.$OVSX_EXTENSION@$VERSION (attempt $attempt/60)"
            sleep 10
          done
          echo "Open VSX did not expose $OVSX_NAMESPACE.$OVSX_EXTENSION@$VERSION" >&2
          exit 1
